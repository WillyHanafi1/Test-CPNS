name: tocpns-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tocpns
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: tocpns_dev
    ports: ['127.0.0.1:55439:5432']
    volumes:
      - dev-postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tocpns -d tocpns_dev]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56389:6379']
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [dev-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 20
volumes:
  dev-postgres:
  dev-redis:
