worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Query strings may contain password reset tokens. Do not record them.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 16m;
    client_body_timeout 20s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $uri $cache_control {
        default '';
        ~^/(api/|health$|unavailable\.json$) 'no-store';
    }

    # Only the dedicated cloudflared container may supply the visitor's IP.
    set_real_ip_from 172.30.43.3;
    real_ip_header CF-Connecting-IP;

    server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location / { return 444; }
    }

    server {
        listen 8080;
        server_name www.tocpns.my.id;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location / { return 308 https://tocpns.my.id$request_uri; }
    }

    server {
        listen 8080;
        server_name tocpns.my.id;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header Cache-Control $cache_control always;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location = /health {
            set $api backend:8001;
            proxy_pass http://$api;
        }
        location /api/ {
            set $api backend:8001;
            proxy_pass http://$api;
            proxy_buffering off;
            proxy_hide_header Server;
        }
        location / {
            set $web frontend:3000;
            proxy_pass http://$web;
        }
        error_page 502 504 =503 /unavailable.json;
        location = /unavailable.json {
            internal;
            default_type application/json;
            return 503 '{"detail":"Layanan sedang disiapkan. Silakan coba lagi nanti."}';
        }
    }
}
