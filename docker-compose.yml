# Development only. Production always uses compose.production.yml.
# Default startup contains only isolated local PostgreSQL/Redis.
name: tocpns-dev
include:
  - path: ./infra/development/compose.yml

x-dev-environment: &dev-environment
  DATABASE_URL: postgresql+asyncpg://tocpns:development-only@postgres:5432/tocpns_dev
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: local-development-only-not-for-production-2026
  ENV: development
  COOKIE_SECURE: 'false'
  FRONTEND_URL: http://localhost:3107
  CORS_ORIGINS: http://localhost:3107
  GOOGLE_API_KEY: ''
  GOOGLE_CLIENT_ID: ''
  ADMIN_AI_ENABLED: 'false'
  MAIL_USERNAME: ''
  MAIL_PASSWORD: ''
  DOKU_CLIENT_ID: ''
  DOKU_SECRET_KEY: ''
  DOKU_ENVIRONMENT: sandbox

services:
  backend:
    profiles: [app]
    build: ./backend
    environment: *dev-environment
    ports: ['127.0.0.1:8017:8001']
    volumes: ['./backend:/app/backend']
    command: [uvicorn, backend.main:app, --host, 0.0.0.0, --port, '8001', --reload]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    profiles: [app]
    build: ./backend
    environment: *dev-environment
    volumes: ['./backend:/app/backend']
    command: [celery, -A, backend.core.celery_app.celery_app, worker, --concurrency=1, --loglevel=WARNING]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    profiles: [app]
    build: ./backend
    environment: *dev-environment
    volumes: ['./backend:/app/backend']
    command: [celery, -A, backend.core.celery_app.celery_app, beat, --schedule=/tmp/celerybeat, --loglevel=WARNING]
    depends_on:
      redis: {condition: service_healthy}
  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8017
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ''
        NEXT_PUBLIC_DOKU_ENVIRONMENT: sandbox
    ports: ['127.0.0.1:3107:3000']
    depends_on: [backend]
