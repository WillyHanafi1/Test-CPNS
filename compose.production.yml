name: ujian

x-logging: &logging
  driver: local
  options:
    max-size: 2m
    max-file: '2'
    compress: 'true'

x-backend: &backend
  image: ujian-backend:${RELEASE_TAG:-prepared}
  env_file:
    - path: ./.secrets/application.env
      format: raw
  environment:
    REDIS_URL: redis://redis:6379/0
    ENV: production
    COOKIE_SECURE: 'true'
    ADMIN_AI_ENABLED: 'false'
  user: '10001:10001'
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  restart: unless-stopped
  stop_grace_period: 45s
  pids_limit: 128
  networks: [application, data]
  depends_on:
    redis:
      condition: service_healthy

services:
  database-backup:
    # backup-postgres.sh requires a compatible digest pin before this profile runs.
    image: ${POSTGRES_BACKUP_IMAGE:-postgres:18-alpine}
    profiles: [operations]
    user: '${RUN_UID:-1000}:${RUN_GID:-1000}'
    env_file:
      - path: ./.secrets/application.env
        format: raw
      # Generated privately by prepare_backup.py; libpq needs separate PG fields.
      - path: ./.secrets/backup-database.env
        required: false
        format: raw
    entrypoint: [sh, /ops/dump-postgres.sh]
    volumes:
      - ./scripts/ops/dump-postgres.sh:/ops/dump-postgres.sh:ro
      - ./.server-notes/backups:/backups
      - ./.secrets/postgres-root-ca.crt:/run/secrets/postgres_root_ca:ro
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]
    mem_limit: 128m
    cpus: 0.25

  backup-store:
    <<: *backend
    # Reuse an application image; a scheduled backup must never start a build.
    profiles: [operations]
    # A read-only script mount also allows backup before the new application/schema is released.
    entrypoint: [python, /ops/backup.py]
    user: '${RUN_UID:-1000}:${RUN_GID:-1000}'
    env_file:
      - path: ./.secrets/operations.env
        required: false
        format: raw
    environment:
      BACKUP_KEY_FILE: /run/secrets/backup_key
    depends_on: {}
    networks: [application]
    volumes:
      - ./backend/ops/backup.py:/ops/backup.py:ro
      - ./.server-notes/backups:/backups
      - ./.secrets/backup.key:/run/secrets/backup_key:ro
      - ./.secrets:/backup-config/secrets:ro
      - ./.production.env:/backup-config/public.env:ro
      - ./.server-notes:/backup-config/manifests:ro
    mem_limit: 192m
    # Restore authenticates the ciphertext before releasing plaintext (two RAM files).
    tmpfs: ['/tmp:size=96m,mode=1777']
    cpus: 0.25
    restart: 'no'

  redis:
    image: ${REDIS_IMAGE:?Base image digest is required}
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --auto-aof-rewrite-percentage, '100', --auto-aof-rewrite-min-size, 16mb, --aof-use-rdb-preamble, 'yes', --maxmemory, 96mb, --maxmemory-policy, noeviction, --save, '60 1']
    # Autosave answers and Celery queues must not be evicted like cache entries.
    volumes: [redis-data:/data]
    networks: [data]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Base image digest is required}
    mem_limit: 512m
    cpus: 0.75
    networks:
      application:
      data:
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

  worker:
    <<: *backend
    command: [celery, -A, backend.core.celery_app.celery_app, worker, --queues=celery, --loglevel=WARNING, --concurrency=1, --max-tasks-per-child=50]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'celery -A backend.core.celery_app.celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  payment-worker:
    <<: *backend
    command: [celery, -A, backend.core.celery_app.celery_app, worker, --queues=payments, --loglevel=WARNING, --concurrency=1, --max-tasks-per-child=50]
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, 'celery -A backend.core.celery_app.celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    <<: *backend
    command: [celery, -A, backend.core.celery_app.celery_app, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat-schedule, --pidfile=/tmp/celerybeat.pid]
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: [CMD, python, -c, "import os,pathlib; os.kill(int(pathlib.Path('/tmp/celerybeat.pid').read_text()),0)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin-ai-worker:
    <<: *backend
    profiles: [admin-ai]
    command: [celery, -A, backend.core.celery_app.celery_app, worker, --queues=admin-ai, --loglevel=WARNING, --concurrency=1]
    environment:
      REDIS_URL: redis://redis:6379/0
      ENV: production
      COOKIE_SECURE: 'true'
      ADMIN_AI_ENABLED: 'true'
    env_file:
      - path: ./.secrets/application.env
        format: raw
      - path: ./.secrets/admin-ai.env
        required: false
        format: raw
    mem_limit: 384m
    cpus: 0.5

  frontend:
    image: ujian-frontend:${RELEASE_TAG:-prepared}
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Base image digest is required}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Public API origin is required}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_DOKU_CLIENT_ID: ${NEXT_PUBLIC_DOKU_CLIENT_ID:-}
        NEXT_PUBLIC_DOKU_ENVIRONMENT: ${NEXT_PUBLIC_DOKU_ENVIRONMENT:-sandbox}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:uid=1001,gid=1001,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  gateway:
    image: ujian-gateway:${RELEASE_TAG:-prepared}
    build:
      context: ./infra/gateway
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:?Base image digest is required}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      application:
        ipv4_address: 172.30.42.2
      edge:
        ipv4_address: 172.30.43.2
    ports:
      - '${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8020}:8080'
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 3s
      retries: 3

  tunnel:
    image: ${CLOUDFLARED_IMAGE:?Base image digest is required}
    profiles: [public]
    command: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', run, --token-file, /run/secrets/cloudflare_token]
    user: '${RUN_UID:-1000}:${RUN_GID:-1000}'
    secrets: [cloudflare_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      edge:
        ipv4_address: 172.30.43.3
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, '127.0.0.1:2000', ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  application:
    ipam:
      config:
        - subnet: 172.30.42.0/24
          ip_range: 172.30.42.128/25
  edge:
    ipam:
      config:
        - subnet: 172.30.43.0/24
          ip_range: 172.30.43.128/25
  data:
    internal: true

volumes:
  redis-data:

secrets:
  cloudflare_token:
    file: ./.secrets/cloudflare-token
