name: Deploy CPNS Proyek

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cek Syntax Backend
        run: |
          python -m py_compile backend/main.py

  deploy:
    needs: test
    # Enable after the new server secrets and production environment are ready.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Ujian via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '9130' }}
          command_timeout: 20m
          script: |
            set -eu
            cd /home/rusunawa/@docker/Ujian
            
            git pull --ff-only origin main
            
            # The runner must have a route to the private SSH host.
            # Start refuses schema drift and never silently migrates a shared DB.
            sudo -n bash scripts/ops/deploy-ujian.sh build
            sudo -n bash scripts/ops/deploy-ujian.sh start
