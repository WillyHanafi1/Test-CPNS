name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Never interrupt SSH while it is replacing containers. Keep only the latest pending run.
concurrency:
  group: ujian-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED != 'false' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - name: Select the latest commit that passed CI
        id: revision
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const expected = context.payload.workflow_run?.head_sha || context.sha;
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main',
            });
            if (branch.commit.sha !== expected) {
              core.notice('Skipping an obsolete release; a newer commit is on main.');
              await core.summary.addRaw('Deploy skipped: a newer commit is on main.').write();
              return;
            }
            if (context.eventName === 'workflow_dispatch') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'qa.yml', head_sha: expected,
                branch: 'main', status: 'success', per_page: 100,
              });
              if (!data.workflow_runs.some(run =>
                ['push', 'workflow_dispatch'].includes(run.event) &&
                run.head_repository?.full_name === context.payload.repository.full_name
              )) {
                core.setFailed('Run CI successfully on the current main commit before deploying.');
                return;
              }
            }
            core.setOutput('sha', expected);
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.revision.outputs.sha != ''
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - name: Deploy the tested revision via SSH
        if: steps.revision.outputs.sha != ''
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT || '9130' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/rusunawa/@docker/Ujian' }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: bash scripts/ops/ci-ssh-deploy.sh
