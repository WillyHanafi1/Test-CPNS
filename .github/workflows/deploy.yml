name: Deploy CPNS Proyek

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tocpns
          POSTGRES_PASSWORD: development-only
          POSTGRES_DB: tocpns_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tocpns -d tocpns_test"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tocpns:development-only@127.0.0.1:5432/tocpns_test
      DATABASE_URL: postgresql+asyncpg://tocpns:development-only@127.0.0.1:5432/tocpns_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: integration-test-only-key-never-for-production
      GOOGLE_API_KEY: ''
      ADMIN_AI_ENABLED: 'false'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Test backend with PostgreSQL
        run: |
          python -m compileall -q backend
          python -m pytest backend/tests -q
      - name: Rehearse additive migration
        env:
          LOCAL_PG_PORT: '5432'
        run: python scripts/ops/verify_migration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8017
        run: |
          npm ci
          npm run lint:participant
          npm run test:unit
          npm run typecheck
          npm run build

  deploy:
    needs: test
    # Enable after the new server secrets and production environment are ready.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Ujian via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '9130' }}
          command_timeout: 20m
          script: |
            set -eu
            cd /home/rusunawa/@docker/Ujian
            
            git pull --ff-only origin main
            
            # The runner must have a route to the private SSH host.
            # Start refuses schema drift and never silently migrates a shared DB.
            sudo -n bash scripts/ops/deploy-ujian.sh build
            sudo -n bash scripts/ops/deploy-ujian.sh start
