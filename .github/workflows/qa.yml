name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '.gitignore', '.gitattributes']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '.gitignore', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

# New pushes replace obsolete checks. Deployment has its own, non-cancelling lock.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tocpns
          POSTGRES_PASSWORD: development-only
          POSTGRES_DB: tocpns_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tocpns -d tocpns_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tocpns:development-only@127.0.0.1:5432/tocpns_test
      DATABASE_URL: postgresql+asyncpg://tocpns:development-only@127.0.0.1:5432/tocpns_test
      SECRET_KEY: integration-test-only-key-never-for-production
      ENV: development
      GOOGLE_API_KEY: ''
      ADMIN_AI_ENABLED: 'false'
      LOCAL_PG_PORT: '5432'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore pip download cache
        id: pip-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: cpns-pip-v1-${{ runner.os }}-py312-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: cpns-pip-v1-${{ runner.os }}-py312-
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Save pip cache on main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - name: Ruff suggestions (non-blocking)
        continue-on-error: true
        run: python -m ruff check backend --output-format=github
      - name: Test backend with PostgreSQL
        run: |
          python -m compileall -q backend
          python -m pytest backend/tests -q --tb=short
      - name: Rehearse migrations on a disposable database
        run: python scripts/ops/verify_migration.py
      - name: Check deployment scripts
        run: |
          for script in scripts/ops/deploy-ujian.sh scripts/ops/ci-ssh-deploy.sh; do bash -n "$script"; done
          python -m unittest discover -s scripts/ops/tests -p 'test_*.py'
      - name: Check Linux backup permissions with disposable fixtures
        run: sudo "$(command -v python)" infra/verification/backup_permissions.py

  frontend:
    name: Frontend tests and build
    # Playwright 1.60 supports Ubuntu 24.04; latest may select a newer unsupported OS.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8017
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: cpns-npm-v1-${{ runner.os }}-node22-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: cpns-npm-v1-${{ runner.os }}-node22-
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Save npm cache on main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: ESLint suggestions (non-blocking)
        continue-on-error: true
        run: npm run lint:participant
      - name: Run contract unit tests
        run: npm run test:unit
      - name: Run Vitest unit tests
        run: npm exec -- vitest run
      - name: Type check
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Test production frontend flows
        run: npm run test:e2e
      - name: Test cache cleanup policy
        run: node --test ../.github/scripts/cleanup-caches.test.cjs

  cleanup:
    name: Remove superseded dependency caches
    needs: [backend, frontend]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { cleanup } = require('./.github/scripts/cleanup-caches.cjs');
            await cleanup({ github, context, core });
