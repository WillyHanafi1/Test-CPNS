name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-audit.yml
      - backend/requirements.txt
      - backend/build_requirements.py
      - frontend/package.json
      - frontend/package-lock.json
  schedule:
    - cron: '31 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.0
      - name: Audit pinned runtime dependencies
        run: |
          python build_requirements.py > "$RUNNER_TEMP/requirements.production.txt"
          python -m pip_audit --disable-pip --no-deps --timeout 15 -r "$RUNNER_TEMP/requirements.production.txt"

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm audit --omit=dev --package-lock-only
